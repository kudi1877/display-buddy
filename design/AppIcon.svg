<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10163A"/>
      <stop offset="0.45" stop-color="#33276E"/>
      <stop offset="0.78" stop-color="#B4517A"/>
      <stop offset="1" stop-color="#F59A57"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#FFFBE6"/>
      <stop offset="0.45" stop-color="#FFD66B"/>
      <stop offset="1" stop-color="#FF8A3D"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFC56B" stop-opacity="0.75"/>
      <stop offset="0.55" stop-color="#FF8A5B" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#FF7A5B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screenWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE7B0"/>
      <stop offset="1" stop-color="#F7A866"/>
    </linearGradient>
    <linearGradient id="screenMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF8E8"/>
      <stop offset="1" stop-color="#FFD08A"/>
    </linearGradient>
    <linearGradient id="screenCool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9D6FF"/>
      <stop offset="1" stop-color="#8E8DE8"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262A4A"/>
      <stop offset="1" stop-color="#0D0F22"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A1E4F"/>
      <stop offset="1" stop-color="#140F2C"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="0.25" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#05061A" flood-opacity="0.55"/>
    </filter>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="186"/>
    </clipPath>
  </defs>

  <g filter="url(#iconShadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sky)"/>
  </g>
  <g clip-path="url(#squircle)">
    <!-- stars -->
    <g fill="#FFFFFF">
      <circle cx="232" cy="236" r="5" opacity="0.9"/>
      <circle cx="318" cy="182" r="3" opacity="0.7"/>
      <circle cx="764" cy="214" r="4" opacity="0.8"/>
      <circle cx="690" cy="168" r="2.5" opacity="0.6"/>
      <circle cx="822" cy="300" r="3" opacity="0.6"/>
      <circle cx="196" cy="340" r="2.5" opacity="0.5"/>
    </g>
    <!-- crescent moon (sub-zero / night) -->
    <path d="M 812 196 a 46 46 0 1 0 22 86 a 36 36 0 1 1 -22 -86 z" fill="#FFF3D1" opacity="0.92"/>

    <!-- sun glow + sun -->
    <circle cx="512" cy="500" r="330" fill="url(#glow)"/>
    <circle cx="512" cy="470" r="190" fill="url(#sun)"/>
    <g stroke="#FFD27A" stroke-width="16" stroke-linecap="round" opacity="0.85">
      <line x1="512" y1="220" x2="512" y2="250"/>
      <line x1="336" y1="296" x2="357" y2="317"/>
      <line x1="688" y1="296" x2="667" y2="317"/>
      <line x1="262" y1="470" x2="292" y2="470"/>
      <line x1="762" y1="470" x2="732" y2="470"/>
    </g>

    <!-- desk -->
    <rect x="100" y="770" width="824" height="160" fill="url(#desk)"/>
    <ellipse cx="512" cy="772" rx="420" ry="16" fill="#FFB27A" opacity="0.35" filter="url(#soft)"/>

    <!-- three vertical monitors -->
    <g filter="url(#shadow)">
      <!-- left -->
      <g transform="rotate(-9 300 600)">
        <rect x="272" y="726" width="56" height="44" fill="#0D0F22"/>
        <rect x="236" y="764" width="128" height="18" rx="9" fill="#1A1C36"/>
        <rect x="200" y="420" width="200" height="320" rx="26" fill="url(#bezel)"/>
        <rect x="214" y="434" width="172" height="292" rx="14" fill="url(#screenWarm)"/>
        <rect x="214" y="434" width="172" height="292" rx="14" fill="url(#shine)"/>
      </g>
      <!-- right -->
      <g transform="rotate(9 724 600)">
        <rect x="696" y="726" width="56" height="44" fill="#0D0F22"/>
        <rect x="660" y="764" width="128" height="18" rx="9" fill="#1A1C36"/>
        <rect x="624" y="420" width="200" height="320" rx="26" fill="url(#bezel)"/>
        <rect x="638" y="434" width="172" height="292" rx="14" fill="url(#screenCool)"/>
        <rect x="638" y="434" width="172" height="292" rx="14" fill="url(#shine)"/>
      </g>
      <!-- middle -->
      <rect x="484" y="736" width="56" height="44" fill="#0D0F22"/>
      <rect x="440" y="774" width="144" height="20" rx="10" fill="#1A1C36"/>
      <rect x="400" y="400" width="224" height="352" rx="28" fill="url(#bezel)"/>
      <rect x="415" y="415" width="194" height="322" rx="15" fill="url(#screenMid)"/>
      <rect x="415" y="415" width="194" height="322" rx="15" fill="url(#shine)"/>
      <!-- brightness slider on the middle screen -->
      <rect x="447" y="660" width="130" height="16" rx="8" fill="#2B2350" opacity="0.18"/>
      <rect x="447" y="660" width="86" height="16" rx="8" fill="#F08A3C"/>
      <circle cx="533" cy="668" r="17" fill="#FFFFFF"/>
      <circle cx="533" cy="668" r="17" fill="none" stroke="#F08A3C" stroke-width="3" opacity="0.5"/>
      <!-- tiny sun glyph on middle screen -->
      <circle cx="512" cy="552" r="34" fill="#F7A23C"/>
      <g stroke="#F7A23C" stroke-width="9" stroke-linecap="round">
        <line x1="512" y1="490" x2="512" y2="502"/>
        <line x1="512" y1="602" x2="512" y2="614"/>
        <line x1="450" y1="552" x2="462" y2="552"/>
        <line x1="562" y1="552" x2="574" y2="552"/>
        <line x1="468" y1="508" x2="476" y2="516"/>
        <line x1="556" y1="508" x2="548" y2="516"/>
        <line x1="468" y1="596" x2="476" y2="588"/>
        <line x1="556" y1="596" x2="548" y2="588"/>
      </g>
    </g>
  </g>
  <!-- glass rim highlight -->
  <rect x="101.5" y="101.5" width="821" height="821" rx="185" fill="none" stroke="url(#rim)" stroke-width="3"/>
</svg>
